name: CI

on:
  # paths 필터를 두지 않는다 — develop-protection이 이 job을 required status check로 요구하므로,
  # 필터에 걸려 실행되지 않으면 체크가 영원히 "Expected" 상태로 남아 머지가 막힌다(룰셋은 skip을
  # pass로 치지 않는다). 프론트 전용 PR에서도 그냥 한 번 돈다.
  # (필터가 있던 시절에도 범위는 deploy.yml의 트리거 경로와 맞춰야 했다 — 예전엔 backend/** 뿐이라
  #  docker-compose.prod.yml·Caddyfile만 바꾼 PR은 CI가 한 건도 돌지 않는데 배포는 트리거됐다.)
  pull_request:
    branches: [develop, main]
  # deploy.yml이 배포 전 게이트로 호출한다(재사용 워크플로).
  # develop 룰셋이 이제 이 검사를 required로 요구하지만, 그것만으로는 배포 대상 커밋의 통과가
  # 보장되지 않는다 — workflow_dispatch 수동 배포는 PR 경로를 아예 타지 않고, 룰셋 bypass나
  # 설정 변경도 언제든 가능하다. 배포 직전에 실제 배포 대상 커밋으로 다시 돌린다.
  # 상세: docs/ci-cd.md
  workflow_call: {}

jobs:
  backend-lint-build:
    name: Backend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: b_territory
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: development
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: b_territory
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      TOUR_API_KEY: ci-dummy
      FIREBASE_PROJECT_ID: ci-dummy
      FIREBASE_CLIENT_EMAIL: ci-dummy@example.com
