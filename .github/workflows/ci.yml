    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Build
        run: npm run build

      - name: Unit test
        run: npm test

      - name: Migration consistency check
        run: |
          npm run migration:run
          output=$(npm run migration:generate -- src/migrations/CiConsistencyCheck 2>&1) || true
          echo "$output"
          if ! echo "$output" | grep -q "No changes in database schema were found"; then
            echo "::error::엔티티 변경분이 마이그레이션 파일에 반영되지 않았습니다. 'npm run migration:generate'로 마이그레이션을 추가해주세요."
            exit 1
          fi

      - name: E2E test
        run: npm run test:e2e
