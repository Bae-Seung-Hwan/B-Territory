name: Temp Lockfile Regen

on:
  push:
    branches:
      - feature/Ryu/frontend-setup
    paths:
      - ".github/workflows/lockfile-regen-temp.yml"

jobs:
  regen:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: rm -f package-lock.json

      - run: npm install

      - uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: frontend/package-lock.json

  verify:
    needs: regen
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          name: package-lock
          path: frontend

      - name: npm ci against the regenerated lockfile (fresh checkout, like real CI)
        run: npm ci
