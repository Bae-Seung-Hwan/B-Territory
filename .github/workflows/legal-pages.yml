name: Legal Pages

# 스토어 심사에 필요한 공개 URL(개인정보처리방침·계정 삭제 안내)을 GitHub Pages로 낸다.
# 본문은 frontend/src/legal/에서 생성하므로, 조항을 고치면 배포된 페이지도 함께 바뀐다.
on:
  push:
    branches: [develop]
    paths:
      - 'frontend/src/legal/**'
      # 접수 주소도 페이지에 실린다.
      - 'frontend/src/constants/contact.ts'
      - 'scripts/build-legal-pages.mjs'
      - '.github/workflows/legal-pages.yml'
  # 조항을 안 고쳤는데 페이지만 다시 올리고 싶을 때(호스팅 설정 변경 등) 손으로 돌린다.
  # 아래 잡에 브랜치 가드가 있다 — dispatch는 임의 ref를 고를 수 있어서, 가드가 없으면
  # 리뷰를 거치지 않은 토픽 브랜치의 조항이 그대로 공개 URL로 나간다.
  workflow_dispatch: {}

# 동시에 두 번 배포되면 Pages가 중간 상태로 남을 수 있어 직렬화한다.
# **진행 중인 런을 취소하지는 않는다.** deploy-pages가 배포를 만든 뒤 취소되면 Pages 쪽에
# in-progress 배포가 남아 다음 런이 "another deployment is in progress"로 실패한다 —
# 조항 오탈자를 고쳐 연속으로 두 번 푸시하는 것만으로 재현되고, 그러면 스토어에 등록한
# URL이 옛 내용인 채 방치된다. Pages 공식 템플릿이 false를 쓰는 이유도 이것이다.
concurrency:
  group: legal-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    # 법적 문서라 develop에서만 배포한다. workflow_dispatch로 다른 ref를 골라도 돌지 않는다.
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # 생성기가 프론트엔드의 로컬 typescript로 legal/만 떼어 컴파일한다.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build legal pages
        run: node scripts/build-legal-pages.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
