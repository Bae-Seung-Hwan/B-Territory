name: Legal Pages

# 공개 사이트를 GitHub Pages로 낸다 — 스토어 심사에 필요한 URL(개인정보처리방침·계정 삭제
# 안내)과, 그 앞에 놓이는 서비스 소개 페이지(index.html)다.
# 법적 문서 본문은 frontend/src/legal/에서 생성하므로, 조항을 고치면 배포된 페이지도 함께
# 바뀐다. 워크플로 이름이 "Legal Pages"로 남아 있는 것은 이 이름이 필수 체크로 걸려 있을 수
# 있어서다 — 하는 일은 사이트 전체다.
on:
  push:
    branches: [develop]
    paths:
      - 'frontend/src/legal/**'
      # 접수 주소도 페이지에 실린다.
      - 'frontend/src/constants/contact.ts'
      # 소개 페이지가 앱 아이콘을 히어로 이미지로 복사해 간다.
      - 'frontend/assets/images/icon.png'
      - 'site-assets/**'
      - 'scripts/build-legal-pages.mjs'
      - 'scripts/build-landing-page.mjs'
      # build:site가 두 생성기의 실행 순서를 정한다.
      - 'package.json'
      - '.github/workflows/legal-pages.yml'
  # 같은 경로를 건드리는 PR에서는 생성기를 돌려만 본다(배포 없음). 아래 verify 잡 참고.
  pull_request:
    paths:
      - 'frontend/src/legal/**'
      - 'frontend/src/constants/contact.ts'
      - 'frontend/assets/images/icon.png'
      - 'site-assets/**'
      - 'scripts/build-legal-pages.mjs'
      - 'scripts/build-landing-page.mjs'
      - 'package.json'
      - '.github/workflows/legal-pages.yml'
  # 조항을 안 고쳤는데 페이지만 다시 올리고 싶을 때(호스팅 설정 변경 등) 손으로 돌린다.
  # 아래 deploy 잡의 첫 스텝에 브랜치 가드가 있다 — dispatch는 임의 ref를 고를 수 있어서,
  # 가드가 없으면 리뷰를 거치지 않은 토픽 브랜치의 조항이 그대로 공개 URL로 나간다.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # 생성기는 프론트엔드의 tsc·eslint 범위 밖(리포지터리 루트)에 있고, ci.yml·frontend-ci.yml
  # 어느 쪽도 실행하지 않는다. 이 잡이 없으면 생성기가 **머지된 뒤에야** 처음 돌아, 깨졌을 때
  # deploy만 실패하고 스토어에 등록한 URL은 옛 개정본을 계속 서빙한다 — 앱이 동의를 받은
  # 문서와 공개된 문서가 갈라지는, 이 생성기가 막으려던 바로 그 상태다.
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: legal-pages-verify-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build site (dry run)
        run: npm run build:site

      # 생성 자체는 성공해도 페이지끼리 끊어질 수 있다 — nav·목차가 가리키는 파일이 실제로
      # 있는지 본다. 문서를 추가하며 파일 이름만 바꾼 경우가 여기서 걸린다.
      - name: Check internal links
        working-directory: web
        run: |
          missing=0
          for file in *.html; do
            for target in $(grep -o 'href="[^"]*\.html"' "$file" | sed 's/^href="//; s/"$//'); do
              # 절대 URL은 이 리포지터리의 파일이 아니다. rel=canonical과 og:url이 자기
              # 주소를 절대 경로로 적으므로, 거르지 않으면 자기 자신을 "없는 파일"로 신고한다.
              case "$target" in http://*|https://*|//*) continue ;; esac
              if [ ! -f "$target" ]; then
                echo "::error file=web/$file::링크 대상 $target 이(가) 생성되지 않았다"
                missing=1
              fi
            done
          done
          exit $missing

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # 동시에 두 번 배포되면 Pages가 중간 상태로 남을 수 있어 직렬화한다.
    # **진행 중인 런을 취소하지는 않는다.** deploy-pages가 배포를 만든 뒤 취소되면 Pages 쪽에
    # in-progress 배포가 남아 다음 런이 "another deployment is in progress"로 실패한다 —
    # 조항 오탈자를 고쳐 연속으로 두 번 푸시하는 것만으로 재현되고, 그러면 스토어에 등록한
    # URL이 옛 내용인 채 방치된다. Pages 공식 템플릿이 false를 쓰는 이유도 이것이다.
    concurrency:
      group: legal-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 법적 문서라 develop에서만 배포한다. 잡을 통째로 `if:`로 스킵하면 워크플로가 **초록으로**
      # 보고되는데, 호스팅 설정을 바꾸고 재배포하려고 dispatch한 사람은 그걸 성공으로 읽는다.
      # 그래서 스킵이 아니라 눈에 띄게 실패시킨다.
      - name: Refuse to deploy from a non-develop ref
        if: github.ref != 'refs/heads/develop'
        run: |
          echo "::error::법적 문서는 develop에서만 배포한다 (요청된 ref: ${{ github.ref }}). 리뷰를 거친 조항만 공개 URL로 나가도록 둔 제한이다 — develop에서 다시 실행할 것."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # 생성기가 프론트엔드의 로컬 typescript로 legal/만 떼어 컴파일한다.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build site
        run: npm run build:site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
